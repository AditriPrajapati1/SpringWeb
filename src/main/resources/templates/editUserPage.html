<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit User</title>
    <link rel="stylesheet" href="/css/theme.css">
</head>

<body>
<div th:insert="navbar.html"></div>

<div class="page">
    <div class="page-header">
        <h2>Edit user</h2>
        <p>Update this user's details.</p>
    </div>

    <div class="card">
        <div class="card-body">
            <form method="POST" action="updateUser">
                <div class="form-group">
                    <label class="form-label">ID</label>
                    <input type="text" class="form-control" th:value="${user.getId()}" name="id" readonly>
                </div>
                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" class="form-control" th:value="${user.getUsername()}" name="username">
                </div>
                <input type="hidden" th:value="${user.getPassword()}" name="password">
                <button type="submit" class="btn btn-primary" style="width:auto;">Update user</button>
            </form>
        </div>
    </div>
</div>
</body>

</html>
