<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gallery</title>
    <link rel="stylesheet" href="/css/theme.css">
</head>
<body>
<div th:insert="navbar.html"></div>

<div class="page">
    <div class="page-header">
        <h2>Gallery</h2>
        <p>Images stored in TiDB.</p>
    </div>

    <form method="POST" action="galleryPost" enctype="multipart/form-data" class="upload-box">
        <input type="file" name="imgFile" class="form-control" style="max-width:320px;">
        <button type="submit" class="btn btn-primary" style="width:auto;">Upload</button>
    </form>

    <div class="gallery-grid">
        <span th:each="image:${session.totalImages}">
            <img th:src=" 'data:image/jpeg;base64,' + ${image.getImage()}">
        </span>
    </div>
</div>

</body>
</html>
