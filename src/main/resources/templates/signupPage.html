<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign Up</title>
    <link rel="stylesheet" href="/css/theme.css">
</head>
<body>

<div class="auth-wrap">
    <div class="auth-card">
        <div class="auth-badge">SW</div>
        <h3>Create account</h3>
        <p class="auth-subtitle">Sign up to get started.</p>

        <div class="alert alert-success" th:text="${signupSuccess}"></div>
        <div class="alert alert-danger" th:text="${LoginError}"></div>
        <div class="alert alert-danger" th:text="${message}"></div>

        <form method="POST" action="signup">
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" class="form-control" placeholder="Choose a username" name="username">
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" placeholder="Choose a password" name="password">
            </div>
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" placeholder="you@example.com" name="email">
            </div>
            <div class="form-check">
                <input type="checkbox" id="remember">
                <label for="remember">Remember me</label>
            </div>
            <button type="submit" class="btn btn-primary">Sign up</button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="login">Sign in</a>
        </div>
    </div>
</div>

</body>
</html>
