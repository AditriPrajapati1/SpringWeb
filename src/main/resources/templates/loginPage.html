<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link rel="stylesheet" href="/css/theme.css">
</head>
<body>

<div class="auth-wrap">
    <div class="auth-card">
        <div class="auth-badge">SW</div>
        <h3>Sign in</h3>
        <p class="auth-subtitle">Welcome back, enter your details below.</p>

        <div class="alert alert-success" th:text="${signupSuccess}"></div>
        <div class="alert alert-danger" th:text="${LoginError}"></div>
        <div class="alert alert-danger" th:text="${message}"></div>

        <form method="POST" action="loginPost">
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" class="form-control" placeholder="Enter your username" name="username">
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" placeholder="Enter your password" name="password">
            </div>
            <div class="form-check">
                <input type="checkbox" id="remember">
                <label for="remember">Remember me</label>
            </div>
            <button type="submit" class="btn btn-primary">Login</button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="signup">Sign up</a>
        </div>
    </div>
</div>

</body>
</html>
