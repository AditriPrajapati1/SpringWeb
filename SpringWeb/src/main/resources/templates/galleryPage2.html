<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gallery Cloudinary</title>
</head>
<body>
<div th:insert="navbar.html"></div>
<h1>Welcome to the Cloudinary Gallery Page</h1>

<hr>
<form method="POST" action="gallery2" enctype="multipart/form-data">
    <input type="file" name="img">
    <input type="submit" value="Upload Files">
</form>

<hr>

<h4>Images from Cloudinary:</h4> <br><br>

<span th:each="image:${cloudImages}">
    <img th:src="${image.getImageUrl()}">
</span>


</body>
</html>
